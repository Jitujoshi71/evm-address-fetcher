name: EVM Custom Date Range Extractor

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Select EVM Chain"
        required: true
        default: "bnb"
        type: choice
        options:
          - bnb
          - ethereum
          - polygon
          - arbitrum
          - base
          - optimism
          - avalanche_c

      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: true
        default: "2026-08-01"
        type: string

      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: true
        default: "2026-08-31"
        type: string

jobs:
  run-batch-fetch:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    permissions:
      contents: write

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout Code
        uses: actions/checkout@v4


      # ========================================================
      # RUST
      # ========================================================

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable


      # ========================================================
      # RUST CACHE
      # ========================================================

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2


      # ========================================================
      # VALIDATE DATE + CONVERT TO UNIX TIMESTAMP
      # ========================================================

      - name: Convert Dates To Unix Timestamps
        shell: bash
        run: |
          set -euo pipefail

          START_DATE="${{ inputs.start_date }}"
          END_DATE="${{ inputs.end_date }}"

          echo "Checking dates..."

          if ! [[ "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "ERROR: Invalid start date format."
            echo "Expected: YYYY-MM-DD"
            exit 1
          fi

          if ! [[ "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "ERROR: Invalid end date format."
            echo "Expected: YYYY-MM-DD"
            exit 1
          fi

          if ! date -u -d "$START_DATE 00:00:00" >/dev/null 2>&1; then
            echo "ERROR: Invalid start date: $START_DATE"
            exit 1
          fi

          if ! date -u -d "$END_DATE 23:59:59" >/dev/null 2>&1; then
            echo "ERROR: Invalid end date: $END_DATE"
            exit 1
          fi

          START_TS=$(date -u -d "$START_DATE 00:00:00" +%s)
          END_TS=$(date -u -d "$END_DATE 23:59:59" +%s)

          if [ "$START_TS" -gt "$END_TS" ]; then
            echo "ERROR: start_date cannot be after end_date."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "DATE RANGE"
          echo "=============================================="
          echo "Start Date : $START_DATE"
          echo "End Date   : $END_DATE"
          echo "Start TS   : $START_TS"
          echo "End TS     : $END_TS"
          echo "=============================================="

          echo "START_TS=$START_TS" >> "$GITHUB_ENV"
          echo "END_TS=$END_TS" >> "$GITHUB_ENV"


      # ========================================================
      # RUN EXTRACTION
      # ========================================================

      - name: Execute Extraction Engine
        env:
          TARGET_CHAIN: ${{ inputs.chain }}
          START_TIMESTAMP: ${{ env.START_TS }}
          END_TIMESTAMP: ${{ env.END_TS }}

          RPC_URL: ${{ secrets.RPC_URL }}

        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "======================================================"
          echo "STARTING EVM ADDRESS EXTRACTION"
          echo "======================================================"
          echo "Chain      : $TARGET_CHAIN"
          echo "Start TS   : $START_TIMESTAMP"
          echo "End TS     : $END_TIMESTAMP"
          echo "======================================================"

          cargo run --release -- \
            --chain "$TARGET_CHAIN" \
            --start-ts "$START_TIMESTAMP" \
            --end-ts "$END_TIMESTAMP"

          echo ""
          echo "======================================================"
          echo "RUST EXTRACTION FINISHED"
          echo "======================================================"

          echo ""
          echo "OUTPUT FILES:"
          find output -maxdepth 1 -type f -printf "%f %s bytes\n" | sort || true


      # ========================================================
      # CREATE ARCHIVE
      # ========================================================

      - name: Create Final Archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dumps

          if [ ! -d "output" ]; then
            echo "ERROR: output directory does not exist."
            exit 1
          fi

          FILE_NAME="${{ inputs.chain }}_${{ inputs.start_date }}_to_${{ inputs.end_date }}.tar.gz"

          echo ""
          echo "Creating archive:"
          echo "dumps/$FILE_NAME"

          tar -czf "dumps/$FILE_NAME" output/

          echo ""
          echo "Archive created successfully:"
          ls -lh "dumps/$FILE_NAME"


      # ========================================================
      # CREATE GITHUB RELEASE
      # ========================================================

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ inputs.chain }}-${{ inputs.start_date }}-to-${{ inputs.end_date }}-$(date +%s)"

          echo ""
          echo "Creating GitHub Release:"
          echo "$TAG_NAME"

          gh release create "$TAG_NAME" \
            "dumps/${{ inputs.chain }}_${{ inputs.start_date }}_to_${{ inputs.end_date }}.tar.gz" \
            --title "${{ inputs.chain }}: ${{ inputs.start_date }} to ${{ inputs.end_date }}" \
            --notes "Unique from/to EVM transaction addresses extracted from ${{ inputs.start_date }} 00:00:00 UTC through ${{ inputs.end_date }} 23:59:59 UTC."

          echo ""
          echo "======================================================"
          echo "RELEASE CREATED SUCCESSFULLY"
          echo "======================================================"

          gh release view "$TAG_NAME"
