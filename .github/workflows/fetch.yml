name: EVM Time-Range Blocks Extractor

on:
  workflow_dispatch:
    inputs:
      chain:
        description: 'Select EVM Chain to extract'
        required: true
        default: 'ethereum'
        type: choice
        options:
          - bnb
          - ethereum
          - polygon
          - arbitrum
          - base
          - optimism
          - avalanche_c
      days:
        description: 'Kitne pichle dino ka data chahiye'
        required: true
        default: '30'

jobs:
  run-batch-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Execute Extraction Engine
        env:
          TARGET_CHAIN: ${{ inputs.chain }}
          DAYS_BACK: ${{ inputs.days }}
          # Dedicated RPC zaroori hai (jaise Alchemy, QuickNode)
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          cargo run --release -- --chain "${{ inputs.chain }}" --days "${{ inputs.days }}"
          
          # Extracted raw files ko compress karna taaki disk space na bhare
          mkdir -p ./dumps
          tar -czf "./dumps/${{ inputs.chain }}-${{ inputs.days }}days.tar.gz" output/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.chain }}-${{ inputs.days }}d-dump-$(date +'%Y%m%d_%H%M%S')"
          gh release create "$TAG_NAME" ./dumps/*.tar.gz \
            --title "${{ inputs.chain }} Last ${{ inputs.days }} Days Dump" \
            --notes "Extraction completed for ${{ inputs.chain }} covering the last ${{ inputs.days }} days."
